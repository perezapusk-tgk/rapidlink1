# Реплика баз в Backblaze B2 (S3-совместимо). Значения берутся из переменных окружения Render.
dbs:
  - path: ${DATA_DIR}/app.db
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: rapidlink/app.db
        endpoint: ${LITESTREAM_ENDPOINT}
        region: ${LITESTREAM_REGION}
        force-path-style: true
        sync-interval: 5s
  - path: ${DATA_DIR}/platform.db
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: rapidlink/platform.db
        endpoint: ${LITESTREAM_ENDPOINT}
        region: ${LITESTREAM_REGION}
        force-path-style: true
        sync-interval: 5s
